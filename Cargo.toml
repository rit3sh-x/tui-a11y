[package]
name = "tui-a11y"
version = "0.1.0"
description = "Experimental Linux (AT-SPI) accessibility tree support for terminal UIs, via AccessKit."
documentation = "https://docs.rs/tui-a11y"
readme = "README.md"
repository = "https://github.com/rit3sh-x/tui-a11y"
homepage = "https://github.com/rit3sh-x/tui-a11y"
keywords = ["tui", "accessibility", "atspi", "a11y", "terminal"]
categories = ["accessibility", "command-line-interface"]
license = "MIT"
edition = "2024"
rust-version = "1.88.0"
exclude = ["*.log", ".github"]

[dependencies]
accesskit = "0.25.0"
accesskit_unix = "0.23.0"

[dev-dependencies]
color-eyre = "0.6"
crossterm = "0.29"
ratatui = "0.30"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
